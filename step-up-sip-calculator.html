<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Up SIP Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d09c;
            --chart-invested: #e8eaff;
            --chart-returns: #5367ff;
            --bg-color: #f6f9fc;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7a7a7a;
            --border: #e0e0e0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            color: var(--text-main);
        }

        .calculator-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .input-section {
            flex: 1;
            padding: 40px;
            border-right: 1px solid var(--border);
        }

        .result-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab {
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            padding-bottom: 5px;
        }

        .tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .input-header label {
            font-weight: 500;
            color: var(--text-main);
            font-size: 15px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #f1f8f5;
            padding: 5px 10px;
            border-radius: 6px;
            color: var(--primary);
            font-weight: 700;
        }

        .input-wrapper input {
            border: none;
            background: transparent;
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            text-align: right;
            width: 80px;
            outline: none;
        }

        .input-wrapper select {
            border: none;
            background: transparent;
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .freq-wrapper {
            background: none;
            padding: 0;
        }

        .text-muted {
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            border: 2px solid var(--primary);
        }

        .donut-chart-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 20px 0 40px 0;
        }

        .donut-chart {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(var(--chart-returns) 0% 50%, var(--chart-invested) 50% 100%);
            transition: background 0.3s;
        }

        .donut-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: var(--card-bg);
            border-radius: 50%;
        }

        .legend {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .dot {
            width: 12px;
            height: 6px;
            border-radius: 4px;
        }

        .dot.invested { background: var(--chart-invested); }
        .dot.returns { background: var(--chart-returns); }

        .results-summary {
            width: 100%;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .result-row.total {
            font-weight: 700;
            font-size: 18px;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .btn-invest {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn-invest:hover {
            background-color: #00b386;
        }

        @media (max-width: 768px) {
            .calculator-container {
                flex-direction: column;
            }
            .input-section {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <!-- Input Section -->
    <div class="input-section">
        <div class="header-tabs">
            <div class="tab active">Step Up SIP</div>
            <div class="tab">Lumpsum</div>
        </div>

        <div class="input-group">
            <div class="input-header">
                <label>SIP Amount</label>
                <div class="input-wrapper">
                    <span>₹</span>
                    <input type="number" id="sipAmount" value="25000" min="500" max="1000000" title="SIP Amount">
                </div>
            </div>
            <input type="range" id="sipAmountRange" value="25000" min="500" max="100000" step="500" title="SIP Amount Range">
        </div>

        <div class="input-group">
            <div class="input-header">
                <label>SIP Frequency</label>
                <div class="input-wrapper freq-wrapper">
                    <select id="sipFrequency" title="SIP Frequency">
                        <option value="365">Daily</option>
                        <option value="52">Weekly</option>
                        <option value="24">15 Days</option>
                        <option value="12" selected>Monthly</option>
                        <option value="4">Quarterly</option>
                    </select>
                </div>
            </div>
        </div>

        <br><br>

        <div class="input-group">
            <div class="input-header">
                <label>Expected return rate (p.a)</label>
                <div class="input-wrapper">
                    <input type="number" id="returnRate" value="12" min="1" max="30" step="0.1" title="Expected return rate">
                    <span>%</span>
                </div>
            </div>
            <input type="range" id="returnRateRange" value="12" min="1" max="30" step="0.1" title="Expected return rate range">
        </div>

        <div class="input-group">
            <div class="input-header">
                <label>Time period</label>
                <div class="input-wrapper">
                    <input type="number" id="timePeriod" value="10" min="1" max="40" title="Time period in years">
                    <span>Yr</span>
                </div>
            </div>
            <input type="range" id="timePeriodRange" value="10" min="1" max="40" step="1" title="Time period range">
        </div>

        <div class="input-group">
            <div class="input-header">
                <label>Annual Step Up</label>
                <div class="input-wrapper">
                    <input type="number" id="stepUp" value="10" min="0" max="50" title="Annual Step Up percentage">
                    <span>%</span>
                </div>
            </div>
            <input type="range" id="stepUpRange" value="10" min="0" max="50" step="1" title="Annual Step Up range">
        </div>
    </div>

    <!-- Result Section -->
    <div class="result-section">
        <div class="legend">
            <div class="legend-item"><div class="dot invested"></div> Invested amount</div>
            <div class="legend-item"><div class="dot returns"></div> Est. returns</div>
        </div>

        <div class="donut-chart-container">
            <div class="donut-chart" id="chart"></div>
            <div class="donut-hole"></div>
        </div>

        <div class="results-summary">
            <div class="result-row">
                <span class="text-muted">Invested amount</span>
                <span id="displayInvested">₹0</span>
            </div>
            <div class="result-row">
                <span class="text-muted">Est. returns</span>
                <span id="displayReturns">₹0</span>
            </div>
            <div class="result-row total">
                <span>Total value</span>
                <span id="displayTotal">₹0</span>
            </div>
        </div>

        <!-- <button class="btn-invest">INVEST NOW</button> -->
    </div>
</div>

<script>
    // Format to Indian Rupee
    const formatCurrency = (amount) => {
        return new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            maximumFractionDigits: 0
        }).format(amount);
    };

    // Elements
    const elements = {
        sipAmount: document.getElementById('sipAmount'),
        sipAmountRange: document.getElementById('sipAmountRange'),
        sipFrequency: document.getElementById('sipFrequency'),
        returnRate: document.getElementById('returnRate'),
        returnRateRange: document.getElementById('returnRateRange'),
        timePeriod: document.getElementById('timePeriod'),
        timePeriodRange: document.getElementById('timePeriodRange'),
        stepUp: document.getElementById('stepUp'),
        stepUpRange: document.getElementById('stepUpRange'),
        
        displayInvested: document.getElementById('displayInvested'),
        displayReturns: document.getElementById('displayReturns'),
        displayTotal: document.getElementById('displayTotal'),
        chart: document.getElementById('chart')
    };

    // Sync input and range slider
    const syncInputs = (textId, rangeId) => {
        elements[textId].addEventListener('input', (e) => {
            elements[rangeId].value = e.target.value;
            calculate();
        });
        elements[rangeId].addEventListener('input', (e) => {
            elements[textId].value = e.target.value;
            calculate();
        });
    };

    syncInputs('sipAmount', 'sipAmountRange');
    syncInputs('returnRate', 'returnRateRange');
    syncInputs('timePeriod', 'timePeriodRange');
    syncInputs('stepUp', 'stepUpRange');
    elements.sipFrequency.addEventListener('change', calculate);

    function calculate() {
        const amount = parseFloat(elements.sipAmount.value) || 0;
        const freq = parseInt(elements.sipFrequency.value) || 12;
        const rateParam = parseFloat(elements.returnRate.value) || 0;
        const years = parseFloat(elements.timePeriod.value) || 0;
        const stepUpRate = parseFloat(elements.stepUp.value) || 0;

        let totalInvested = 0;
        let futureValue = 0;
        let currentSipAmount = amount;
        
        // Annual Return Rate to Periodic Return Rate
        const periodicRate = rateParam / 100 / freq;

        for (let y = 1; y <= years; y++) {
            // Calculate for each period in a year
            for (let p = 1; p <= freq; p++) {
                futureValue = futureValue * (1 + periodicRate) + currentSipAmount;
                totalInvested += currentSipAmount;
            }
            // Apply annual step-up to the SIP amount for next year
            currentSipAmount = currentSipAmount * (1 + (stepUpRate / 100));
        }

        const estReturns = futureValue - totalInvested;

        // Update Text
        elements.displayInvested.innerText = formatCurrency(totalInvested);
        elements.displayReturns.innerText = formatCurrency(estReturns);
        elements.displayTotal.innerText = formatCurrency(futureValue);

        // Update Chart
        let returnsPercent = 0;
        if(futureValue > 0) {
             returnsPercent = (estReturns / futureValue) * 100;
        }
        
        // conic-gradient format: returns(blue) from 0 to x%, invested(light blue) from x% to 100%
        elements.chart.style.background = `conic-gradient(var(--chart-returns) 0% ${returnsPercent}%, var(--chart-invested) ${returnsPercent}% 100%)`;
    }

    // Initial calculation
    calculate();
</script>

</body>
</html>
